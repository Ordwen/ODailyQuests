name: Dependency Healthcheck

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1" # Weekly Monday 04:00 UTC
  push:
    branches:
      - master
      - "3.0.3"
    paths:
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/dependency-healthcheck.yml"
      - "gradle/dependency-locks/**"

env:
  JAVA_VERSION: "21"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g"

jobs:
  fresh-compile-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Ensure lockfiles exist
        run: |
          if [ ! -f "gradle.lockfile" ]; then
            echo "Missing gradle.lockfile. Run './gradlew dependencies --write-locks' and commit it."
            exit 1
          fi

      - name: Compile with fresh dependencies (no cache)
        run: |
          ./gradlew clean classes \
            --refresh-dependencies \
            --no-build-cache \
            --stacktrace \
            --warning-mode all
